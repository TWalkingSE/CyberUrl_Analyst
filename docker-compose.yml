version: "3.8"

services:
  cyberurl:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./datasets/downloads:/app/datasets/downloads
      - ./.env:/app/.env:ro
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
